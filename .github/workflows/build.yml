name: build

on:
  push:
  pull_request:

jobs:
  msvc:
    name: MSVC v143 ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.platform }} -T v143
      - name: Build
        run: cmake --build build/${{ matrix.arch }} --config Release
      - name: Test (unit, live, CLI)
        run: ctest --test-dir build/${{ matrix.arch }} -C Release --output-on-failure
      - name: Windows 7 import check
        run: python tools/check_imports.py build/${{ matrix.arch }}/sevenmon.exe build/${{ matrix.arch }}/sevenmon_tests.exe
      - name: Smoke run
        shell: cmd
        run: |
          build\${{ matrix.arch }}\sevenmon.exe summary
          build\${{ matrix.arch }}\sevenmon.exe doctor
          build\${{ matrix.arch }}\sevenmon.exe processes --top 5 --json
      - uses: actions/upload-artifact@v4
        with:
          name: sevenmon-msvc-${{ matrix.arch }}
          path: build/${{ matrix.arch }}/sevenmon.exe

  mingw:
    name: mingw-w64 cross build (x86 + x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build \
            g++-mingw-w64-x86-64-win32 g++-mingw-w64-i686-win32 binutils-mingw-w64
      - name: Build x64
        run: cmake --preset mingw-x64 && cmake --build build/x64
      - name: Build x86
        run: cmake --preset mingw-x86 && cmake --build build/x86
      - name: Windows 7 import check
        run: python3 tools/check_imports.py build/x64/sevenmon.exe build/x86/sevenmon.exe build/x64/sevenmon_tests.exe build/x86/sevenmon_tests.exe
      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: sevenmon-mingw
          path: dist/
